[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19",
    "chromadb>=1.0",
    "copernicusmarine",
    "fastapi",
    "httpx",
    "librosa",
    "matplotlib",
    "numpy",
    "supabase",
    "pydantic-settings",
    "python-dotenv",
    "structlog",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]