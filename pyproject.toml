[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19",
    "chromadb>=1.0",
    "copernicusmarine",
    "fastapi",
    "httpx",
    "librosa",
    "matplotlib",
    "numpy",
    "supabase",
    "pydantic-settings",
    "python-dotenv",
    "structlog",
    "rich>=13.7",
    "typer>0.12",
    "uvicorn",
    "pyfiglet>=1.0",
    "ollama>=0.4",
    "pyyaml>=6.0",
]
[project.scripts]
os = "ocean_sentinel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ocean_sentinel.test_samples" = ["*.wav", "*.yaml"]